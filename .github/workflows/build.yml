name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - run: swift --version

      - name: Build
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && export VERSION="${GITHUB_REF_NAME#v}"
          ./build.sh

      - name: Package
        run: ditto -c -k --keepParent build/MyPRs.app MyPRs.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MyPRs
          path: MyPRs.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MyPRs.zip --title "$GITHUB_REF_NAME" --generate-notes
