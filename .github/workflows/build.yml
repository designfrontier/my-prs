name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - run: swift --version

      - name: Next version
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          next=$([ -z "$last" ] && echo 1.0.0 || echo "$major.$minor.$((patch + 1))")
          echo "VERSION=$next" >> "$GITHUB_ENV"
          echo "Version $next"

      - name: Build
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent build/MyPRs.app MyPRs.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MyPRs
          path: MyPRs.zip

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" MyPRs.zip --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
